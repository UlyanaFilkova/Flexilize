name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-and-build:
    name: Typecheck and build extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build Chromium extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Upload browser builds
        uses: actions/upload-artifact@v7
        with:
          name: browser-extensions-${{ github.sha }}
          path: |
            dist/chrome/
            dist/firefox/
          if-no-files-found: error
          retention-days: 14

  check-store-release-version:
    name: Check store release version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STORE_PUBLISHING_ENABLED == 'true'
    needs: validate-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Require a new extension version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: node scripts/check-main-publish-version.mjs

  publish-chrome-web-store:
    name: Publish to Chrome Web Store
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STORE_PUBLISHING_ENABLED == 'true'
    needs: check-store-release-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: store-publish-chrome-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome extension
        run: npm run zip:chrome

      - name: Upload and submit to Chrome Web Store
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome-web-store.mjs dist/*-chrome.zip

  publish-mozilla-addons:
    name: Publish to Mozilla Add-ons
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STORE_PUBLISHING_ENABLED == 'true'
    needs: check-store-release-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: store-publish-mozilla-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Firefox extension and source
        run: |
          npm run zip:firefox
          npm run zip:firefox-source

      - name: Upload and submit to AMO
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          AMO_ADDON_GUID: ${{ vars.AMO_ADDON_GUID }}
        run: node scripts/publish-mozilla-addons.mjs dist/*-firefox.zip dist/*-source.zip
