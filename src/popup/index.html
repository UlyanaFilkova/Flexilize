<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сохранённые переводы</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Мои переводы</h1>
      <p id="counter">Загрузка…</p>
    </div>
    <button id="clear" class="icon-button" type="button" title="Очистить список" aria-label="Очистить список"></button>
  </header>

  <main>
    <div id="empty" hidden>
      <div class="empty-icon">Aa</div>
      <strong>Пока пусто</strong>
      <span>Выделите текст на любой странице — перевод появится здесь.</span>
    </div>
    <ol id="records"></ol>
  </main>

  <footer>
    <label class="format-picker">
      <span>Формат экспорта</span>
      <select id="export-format" aria-label="Формат экспорта">
        <option value="json">JSON</option>
        <option value="pdf">PDF</option>
        <option value="txt">TXT</option>
        <option value="csv">CSV</option>
        <option value="tsv">TSV</option>
        <option value="anki-csv">Anki CSV</option>
        <option value="anki-tsv">Anki TSV</option>
        <option value="xlsx">XLSX</option>
        <option value="markdown">Markdown</option>
        <option value="html">HTML</option>
      </select>
    </label>
    <button id="export" type="button">Скачать JSON</button>
  </footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
