<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сохранённые переводы</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div>
      <h1>Мои переводы</h1>
      <p id="counter">Загрузка…</p>
    </div>
    <div class="header-actions">
      <button id="history" class="icon-button" type="button" title="История переводов" aria-label="Открыть историю переводов">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
          <path d="M3 3v5h5M12 7v5l3 2"></path>
        </svg>
      </button>
      <button id="settings" class="icon-button" type="button" title="Настройки" aria-label="Открыть настройки">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"></path>
          <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.86 2.86-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1.4 1.6H9.55A1.7 1.7 0 0 0 8.4 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.86-2.86.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-1.6-1.4V9.55A1.7 1.7 0 0 0 4 8.4a1.7 1.7 0 0 0-.34-1.88l-.06-.06L6.46 3.6l.06.06A1.7 1.7 0 0 0 8.4 4a1.7 1.7 0 0 0 1.4-1.6h4.05A1.7 1.7 0 0 0 15 4a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.86 2.86-.06.06A1.7 1.7 0 0 0 19.4 8.4a1.7 1.7 0 0 0 1.6 1.4v4.05A1.7 1.7 0 0 0 19.4 15Z"></path>
        </svg>
      </button>
      <button id="clear" class="icon-button clear-button" type="button" title="Очистить список" aria-label="Очистить список">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v5"></path>
          <path d="M14 11v5"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <div id="empty" hidden>
      <div class="empty-icon">Aa</div>
      <strong>Пока пусто</strong>
      <span>Выделите текст на любой странице — перевод появится здесь.</span>
    </div>
    <ol id="records"></ol>
  </main>

  <footer>
    <label class="format-picker">
      <span>Формат экспорта</span>
      <select id="export-format" aria-label="Формат экспорта">
        <option value="pdf">PDF</option>
        <option value="json">JSON</option>
        <option value="txt">TXT</option>
        <option value="csv">CSV</option>
        <option value="tsv">TSV</option>
        <option value="anki-csv">Anki CSV</option>
        <option value="anki-tsv">Anki TSV</option>
        <option value="xlsx">XLSX</option>
        <option value="markdown">Markdown</option>
        <option value="html">HTML</option>
      </select>
    </label>
    <button id="export" type="button">Скачать PDF</button>
  </footer>
  <div id="notice" role="status" aria-live="polite"></div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
